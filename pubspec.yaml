name: dark_echo
description: A 2D survival horror game with echolocation mechanics
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Audio
  audioplayers: ^6.0.0
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # URL Launcher
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/audio/game_ambience.ogg  # Background loop
    - assets/audio/menu_theme.ogg     # Menu music loop
    - assets/audio/ping.ogg           # Echo wave sound
    - assets/audio/footsteps.ogg      # Movement loop
    - assets/audio/heartbeat.ogg      # Danger proximity loop
    - assets/audio/tension.ogg        # Chase tension loop
    - assets/audio/breathing.ogg      # Death sequence - stage 1 (loud)
    - assets/audio/caught.ogg         # Death sequence - stage 2
    - assets/audio/victory.ogg        # Victory sound

  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"